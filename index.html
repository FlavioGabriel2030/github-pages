<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Flávio Gabriel</title>
    <style>
        :root {
            --bg-color: #121212;
            --section-bg: #1e2024;
            --accent-color: #00e5ff;
            --accent-hover: #00b3cc;
            --text-primary: #e0e0e0;
            --text-secondary: #a0aab2;
            --border-color: #33363d;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #0f1115 0%, #1e2024 100%);
            border-bottom: 2px solid var(--accent-color);
            color: white;
            text-align: center;
            padding: 4rem 1rem;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: -1px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        header p {
            font-size: 1.2rem;
            margin-top: 15px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: var(--section-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        section:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 229, 255, 0.4);
        }

        h2 {
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 1.8rem;
            position: relative;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 50px;
            height: 2px;
            background-color: var(--accent-color);
        }

        h3 {
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 1.2rem;
        }

        ul { padding-left: 20px; }
        li { margin-bottom: 15px; color: var(--text-secondary); }
        li strong { color: var(--text-primary); }

        a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        a:hover {
            color: var(--accent-hover);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
            text-decoration: none;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .tags span {
            background: #272a30;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tags span:hover {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        footer {
            text-align: center;
            padding: 30px;
            background: var(--section-bg);
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
